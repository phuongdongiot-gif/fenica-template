<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preloader - Fully Responsive</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0e1e2e;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        #preloader-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9998;
            pointer-events: none;
        }

        #svg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            overflow: hidden;
        }

        /* --- STYLES CHO SVG (Đồng bộ sang màu Xanh Dương) --- */
        .menu-bg-svg {
            width: 400px;
            max-width: 60vw;
            /* Tối ưu cho mobile: không bao giờ vượt quá 60% màn hình */
            height: auto;

            fill: #d4ae6f;
            /* Đổi màu SVG khớp với Canvas JS */

            opacity: 0;
            transform: scale(0.5);

            animation: menuBgAnim 2.5s ease-in-out infinite;
            will-change: transform, opacity, filter;
        }

        /* Keyframes đồng bộ màu Xanh Dương Neon */
        @keyframes menuBgAnim {

            0%,
            100% {
                filter: drop-shadow(0 0 10px rgba(15, 103, 177, 0.6)) drop-shadow(0 0 20px rgba(15, 103, 177, 0.4));
            }

            50% {
                filter: drop-shadow(0 0 15px rgba(15, 103, 177, 1)) drop-shadow(0 0 35px rgba(15, 103, 177, 0.8));
            }
        }

        /* --- LAYER NỘI DUNG CHÍNH --- */
        .main-content {
            opacity: 0;
            transform: scale(0.9) translateY(20px);
            padding: 10vw 5vw;
            /* Dùng vw để padding responsive */
            max-width: 900px;
            margin: 0 auto;
            text-align: center;
        }

        h1 {
            /* Hàm clamp: Min 2.5rem, lý tưởng 6vw, Max 4rem */
            font-size: clamp(2.5rem, 6vw, 4rem);
            color: #0f67b1;
            margin-bottom: 20px;
            letter-spacing: -1px;
            text-shadow: 0 0 15px rgba(15, 103, 177, 0.4);
        }

        p {
            /* Tự động thu nhỏ chữ trên Mobile */
            font-size: clamp(1rem, 3vw, 1.25rem);
            line-height: 1.7;
            color: #a0aec0;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>

<body>

    <canvas id="preloader-canvas"></canvas>

    <div id="svg-container">
        <svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1920 1080" class="menu-bg-svg origin-center"
            id="logo-svg">
            <path
                d="M1138.1,203.26h-35.36c-2.25,0-4.08,1.83-4.08,4.08v252.98l-.03,4.09c-.02,3.01-3.32,4.84-5.88,3.26l-422.52-260.33c-2.72-1.36-4.08,0-4.08,2.72v80.25c0,28.56,17.68,59.84,43.52,76.17l500.24,297.23c2.57,1.53,5.83-.33,5.83-3.32l-.11-370.08c0-51.68-32.64-87.05-77.53-87.05ZM751.83,826.2h32.86c2.13,0,3.86-1.73,3.86-3.86v-234.16c0-4.08,2.72-5.44,8.16-2.72l412.11,255.7c4.08,1.36,6.8,0,6.8-4.08v-78.89c0-31.28-17.68-62.57-42.16-76.17l-501.5-295.48c-2.57-1.52-5.82.34-5.82,3.32v349.28c0,51.68,35.36,87.05,85.69,87.05Z" />
        </svg>
    </div>

    <div class="main-content" id="content">
        <h1>Uy Lực Tuyệt Đối</h1>
        <p>Khoảng trống đã được loại bỏ. Tất cả các đường sọc lao xuống và hợp nhất hoàn toàn tại đường xích đạo của màn
            hình. Ngay trên bức tường ánh sáng đó, Logo của bạn hiện ra như một dấu ấn quyền lực trước khi mở toang cánh
            cửa không gian.</p>
    </div>

    <script>
        const canvas = document.getElementById('preloader-canvas');
        const ctx = canvas.getContext('2d', { alpha: true });

        let numLines = 140;
        let linesArray = [];
        let renderTicker;

        function setupCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            // FIX RESPONSIVE: Giảm số lượng sọc trên điện thoại để không bị nhiễu màn hình
            numLines = window.innerWidth < 768 ? 100 : 300;

            const spacing = canvas.width / numLines;
            const lineWidth = Math.max(1, spacing * 0.45);

            linesArray = [];

            for (let i = 0; i < numLines; i++) {
                const xPos = i * spacing + (spacing - lineWidth) / 2;

                const ratioFromCenter = Math.abs(i - numLines / 2) / (numLines / 2);
                const baseOpacity = 0.2 + 0.8 * (1 - ratioFromCenter);

                linesArray.push({
                    x: xPos,
                    width: lineWidth,
                    baseOpacity: baseOpacity,
                    progressY: 0,
                    opacity: 1
                });
            }
            if (!renderTicker) renderTicker = gsap.ticker.add(render);
        }

        function playPreloader() {
            const tl = gsap.timeline({
                onComplete: () => {
                    gsap.ticker.remove(render);
                    renderTicker = null;
                    canvas.remove();
                    document.getElementById('svg-container').remove();
                    document.body.style.overflow = 'auto';
                }
            });

            tl.to(linesArray, {
                progressY: 1,
                duration: 1.2,
                ease: "power3.inOut",
                stagger: { amount: 0.8, from: "edges" }
            })

                .to("#logo-svg", {
                    opacity: 1,
                    scale: 1,
                    duration: 0.6,
                    ease: "back.out(1.5)"
                }, "-=0.2")

                .to(linesArray, {
                    opacity: 0,
                    duration: 0.4,
                    ease: "power2.inOut"
                }, "+=0.3")

                .to("#logo-svg", {
                    scale: 80,
                    opacity: 0,
                    duration: 0.4,
                    ease: "power4.in"
                }, "+=0.3")

                .to("#content", {
                    opacity: 1,
                    scale: 1,
                    y: 0,
                    duration: 1.4,
                    ease: "power3.out"
                }, "-=0.4");
        }

        function render() {
            let w = canvas.width;
            let h = canvas.height;
            let cy = h / 2;

            ctx.clearRect(0, 0, w, h);
            ctx.globalCompositeOperation = 'screen';

            for (let i = 0; i < numLines; i++) {
                let line = linesArray[i];
                if (line.opacity <= 0 || line.progressY <= 0) continue;

                let currentH = cy * line.progressY;
                let finalOpacity = line.opacity * line.baseOpacity;

                // Màu Xanh Dương của bạn
                ctx.fillStyle = `rgba(15, 103, 160, ${finalOpacity * 0.4})`;
                ctx.fillRect(line.x - line.width, 0, line.width * 3, currentH);
                ctx.fillRect(line.x - line.width, h - currentH, line.width * 3, currentH);

                ctx.fillStyle = `rgba(15, 103, 177, ${finalOpacity})`;
                ctx.fillRect(line.x, 0, line.width, currentH);
                ctx.fillRect(line.x, h - currentH, line.width, currentH);
            }

            ctx.globalCompositeOperation = 'source-over';
        }

        // --- FIX RESIZE GLITCH ---
        // Hàm cập nhật lại tọa độ sọc khi xoay màn hình MÀ KHÔNG LÀM GÃY ANIMATION
        function handleResize() {
            if (!document.getElementById('preloader-canvas')) return;

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            if (linesArray.length > 0) {
                const spacing = canvas.width / numLines;
                const lineWidth = Math.max(1.5, spacing * 0.45);

                for (let i = 0; i < numLines; i++) {
                    // Chỉ cập nhật X và Width, giữ nguyên biến tiến độ (progressY) đang chạy
                    linesArray[i].x = i * spacing + (spacing - lineWidth) / 2;
                    linesArray[i].width = lineWidth;
                }
            }
        }

        setupCanvas();
        window.onload = () => { playPreloader(); };
        window.addEventListener('resize', handleResize);
    </script>
</body>

</html>
